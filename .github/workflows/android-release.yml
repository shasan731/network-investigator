name: Signed Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_STORE_PASSWORD" ] || [ -z "$ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_KEY_ALIAS" ] || [ -z "$ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing. Configure all four ANDROID_KEYSTORE_* / ANDROID_KEY_* repository secrets."
            exit 1
          fi
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/network-investigator-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ORG_GRADLE_PROJECT_NETWORK_INVESTIGATOR_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Test, lint, and build signed release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease --continue --stacktrace
      - name: Upload signed release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: network-investigator-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-investigator-release-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/network-investigator-release.jks"
